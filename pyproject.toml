[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-avatar-diffusion"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "Pillow",
    "torch==2.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
notebook = [
    "matplotlib",
    "nbformat",
    "nbconvert",
    "ipykernel",
]
eval = [
    "clean-fid==0.1.35",
    "lpips==0.1.4",
    "scipy==1.15.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
