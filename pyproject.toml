[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-avatar-diffusion"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "Pillow",
    "torch==2.5.1",
    "numpy>=1.26,<2",
]

[project.scripts]
tiny-avatar = "tiny_avatar_diffusion.cli:main"
tiny-avatar-public = "tiny_avatar_diffusion.public_cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
demo = [
    "streamlit>=1.32,<2",
]
notebook = [
    "matplotlib",
    "nbformat",
    "nbconvert",
    "ipykernel",
]
eval = [
    "clean-fid==0.1.35",
    "lpips==0.1.4",
    "scipy==1.15.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
tiny_avatar_diffusion = ["public_model_manifest.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
