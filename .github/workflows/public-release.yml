name: Public release verification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify-public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install public verification dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify distributed public models
        run: python -m pytest tests/test_public_release.py tests/test_final_streamlit_app.py tests/test_public_cli.py -q
